name: Mark task complete on merge

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  mark-complete:
    # Só executa se o PR foi mergeado (não apenas fechado/rejeitado)
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      contents: write  # necessário para fazer commit no ROADMAP.md

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair ID da task pelo nome do branch
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Branch mergeado: $BRANCH"

          # Aceita padrões: task/F1, task/A2, task/Q1, task/V1
          if [[ "$BRANCH" =~ ^task/([A-Z][0-9]+)$ ]]; then
            TASK_ID="${BASH_REMATCH[1]}"
            echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
            echo "Task identificada: $TASK_ID"
          else
            echo "task_id=" >> "$GITHUB_OUTPUT"
            echo "Branch '$BRANCH' não segue o padrão task/<ID> — nenhuma atualização no ROADMAP."
          fi

      - name: Atualizar ROADMAP.md — marcar task como [x]
        if: steps.extract.outputs.task_id != ''
        run: |
          TASK_ID="${{ steps.extract.outputs.task_id }}"

          # Substitui [~] pelo [x] na linha da task na tabela de status
          # Padrão esperado na tabela: | F1 | Título | [~] |
          if grep -q "| $TASK_ID |" ROADMAP.md; then
            sed -i "s/| $TASK_ID | \(.*\) | \[~\] |/| $TASK_ID | \1 | [x] |/" ROADMAP.md
            echo "ROADMAP.md atualizado: task $TASK_ID marcada como [x]"
          else
            echo "Task $TASK_ID não encontrada na tabela do ROADMAP.md — nenhuma alteração feita."
            exit 0
          fi

      - name: Verificar se houve mudança
        if: steps.extract.outputs.task_id != ''
        id: diff
        run: |
          if git diff --quiet ROADMAP.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mudança detectada (task pode já estar como [x] ou não estava como [~])."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push da atualização
        if: steps.extract.outputs.task_id != '' && steps.diff.outputs.changed == 'true'
        run: |
          TASK_ID="${{ steps.extract.outputs.task_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "chore: mark task $TASK_ID as complete in ROADMAP.md [skip ci]"
          git push origin master